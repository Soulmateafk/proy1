<div class="d-flex justify-content-center" 
     style="padding-top: 40px; padding-bottom: 40px;">
     
  <form [formGroup]="contactForm" (ngSubmit)="enviar()"
        class="p-4 shadow rounded"
        style="width: 100%; max-width: 500px;">

    <div class="form-floating mb-3">
      <input type="email" class="form-control" placeholder="name@example.com" formControlName="email">
      <label>Email</label>
    </div>

    <div class="form-floating mb-3">
      <input type="text" class="form-control" placeholder="Nombre" formControlName="nombre">
      <label>Nombre</label>
    </div>

    <div class="form-floating mb-3">
      <input type="text" class="form-control" placeholder="Teléfono" formControlName="telefono">
      <label>Teléfono</label>
    </div>

    <div class="form-floating mb-3">
      <textarea class="form-control" placeholder="Comentarios" style="height: 100px" formControlName="comentarios"></textarea>
      <label>Comentarios</label>
    </div>

    <div class="form-floating mb-3">
      <select class="form-select" formControlName="causa">
        <option value="">Selecciona una opción</option>
        <option value="reporte">Reporte</option>
        <option value="mantenimiento">Mantenimiento</option>
        <option value="sugerencia">Sugerencia</option>
      </select>
      <label>Causa</label>
    </div>

    <button type="submit" class="btn btn-primary w-100">Enviar</button>

  </form>
</div>
